[project]
name = "vektri-clip-studio"
version = "0.1.0"
description = "Local-first, evidence-grounded video clipping and review"
requires-python = ">=3.11,<3.12"
dependencies = [
 "fastapi==0.162.0", "uvicorn==0.54.0", "pydantic==2.14.2",
 "python-multipart==0.0.33", "httpx==0.28.1", "faster-whisper==1.2.1",
 "onnxruntime==1.23.2", "tokenizers==0.22.2", "numpy==2.2.6",
 "opencv-python-headless==4.12.0.88", "psutil==7.2.2", "Pillow==12.3.0"
]
[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-timeout==2.4.0"]
[project.scripts]
clipstudio = "clipstudio.cli:main"
[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/clipstudio"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
